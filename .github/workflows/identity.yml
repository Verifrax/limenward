name: Identity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  LC_ALL: C
  TZ: UTC

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Verify primitive identity boundary
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          test -f LICENSE
          test -f VERSION
          test -f package.json
          test -f limenward.sh

          grep -q "^# LIMENWARD$" README.md
          grep -q "^Primitive ID: PRIM-004" README.md
          grep -q "^Package: @verifrax/limenward" README.md
          grep -q "^Binary: limenward" README.md

          python3 - <<'PY2'
import json
from pathlib import Path

data = json.loads(Path("package.json").read_text())

assert data["name"] == "@verifrax/limenward", data
assert data["version"] == "0.1.0", data
assert data["license"] == "MIT", data
assert data["bin"]["limenward"] == "limenward.sh", data
assert data["repository"]["url"].endswith("Verifrax/limenward.git"), data
assert data["homepage"] == "https://github.com/Verifrax/limenward#readme", data
assert data["bugs"]["url"] == "https://github.com/Verifrax/limenward/issues", data
assert data["publishConfig"]["access"] == "public", data
PY2
